name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install h5py reference dependencies
        run: python -m pip install "h5py>=3.16,<4"
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust and h5py tests
        run: cargo +stable test --locked -- --include-ignored
      - name: Test S3 ranges and SIMD Deflate
        run: cargo +stable test --locked --all-features -- --include-ignored
