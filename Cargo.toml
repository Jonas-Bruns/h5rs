[workspace]
members = [".", "crates/h5rs-python"]
default-members = ["."]
resolver = "2"

[package]
name = "h5rs"
version = "0.2.1"
edition = "2021"
rust-version = "1.85.1"
description = "Read numeric HDF5 datasets from disk and S3"
license = "MIT"
readme = "README.md"
exclude = ["**/__pycache__/**", "/python/h5rs/*.pdb", "/python/h5rs/*.pyd", "/python/h5rs/*.so"]

[features]
s3 = ["dep:cc", "dep:rustls", "dep:ureq"]
s3-async-io = ["s3", "dep:http-body-util", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util", "dep:tokio", "dep:tower-service"]
simd-deflate = ["flate2/zlib-rs", "flate2/runtime_detection"]

[[bench]]
name = "read_tiles"
harness = false

[dependencies]
async-lock = "3.4"
flate2 = "1.1.11"
futures-channel = "0.3"
hdf5-metno-sys = { version = "0.12.5", features = ["static"] }
parking_lot = "0.12"
rayon = "1.10"
thiserror = "2"
ureq = { version = "3.1", default-features = false, features = ["rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tower-service = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }

[build-dependencies]
cc = { version = "1.1", optional = true }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
